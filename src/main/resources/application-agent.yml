# AI Agent Configuration
jira:
  base-url: ${JIRA_BASE_URL:https://your-domain.atlassian.net}
  username: ${JIRA_USERNAME:}
  api-token: ${JIRA_API_TOKEN:}
  transitions:
    in-progress: "21"
    done: "31"
    failed: "41"

ai:
  provider: ${AI_PROVIDER:mock}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gpt-3.5-turbo}

agent:
  monitoring:
    enabled: ${AGENT_MONITORING_ENABLED:true}
    interval: ${AGENT_MONITORING_INTERVAL:300000}
  deployment:
    enabled: ${AGENT_DEPLOYMENT_ENABLED:true}
    auto-deploy: ${AGENT_AUTO_DEPLOY:false}

logging:
  level:
    com.facility.management.application.service.JiraMonitoringService: INFO
    com.facility.management.application.service.AIAgentService: INFO
    com.facility.management.infrastructure.jira: INFO
