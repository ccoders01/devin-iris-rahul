spring:
  application:
    name: facility-management-system
  
  datasource:
    url: jdbc:h2:mem:facilitydb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  thymeleaf:
    cache: false

server:
  port: 8080

logging:
  level:
    com.facility.management: DEBUG
    org.hibernate.SQL: DEBUG
